
<ng-container *ngIf="!isPublicRoute">
	<app-navbar-administrador></app-navbar-administrador>
	<div class="private-shell">
		<app-sidebar></app-sidebar>
		<main class="private-content">
			<router-outlet></router-outlet>
		</main>
	</div>

	<button
		*ngIf="mostrarBotaoNovoPedido"
		type="button"
		class="fab-novo-pedido"
		routerLink="/fazer-pedido"
		title="Novo Pedido">
		<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
		</svg>
		Pedido
	</button>
</ng-container>

<ng-container *ngIf="isPublicRoute">
	<router-outlet></router-outlet>
</ng-container>
