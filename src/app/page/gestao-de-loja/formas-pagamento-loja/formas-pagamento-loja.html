<div class="pagamento-container">

  <app-loja-cabecalho
    [lojaId]="lojaId"
    titulo="Formas de pagamento"
    subtitulo="Escolha quais formas de pagamento a loja aceita">
  </app-loja-cabecalho>

  <!-- Card -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      </div>
      <div>
        <p class="card-title">Formas Aceitas</p>
        <p class="card-subtitle">Ative ou desative cada forma de pagamento</p>
      </div>
    </div>

    <!-- Loading -->
    <div *ngIf="carregando" class="loading-state">
      <div class="spinner"></div>
      <span>Carregando formas de pagamento...</span>
    </div>

    <!-- Empty -->
    <div *ngIf="!carregando && formas.length === 0" class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#DCD5C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <p>Nenhuma forma de pagamento configurada</p>
    </div>

    <!-- Lista -->
    <div *ngIf="!carregando && formas.length > 0" class="formas-list">
      <div
        class="forma-item"
        *ngFor="let forma of formas"
        [class.ativo]="forma.ativo"
      >
        <div class="forma-info">
          <div class="forma-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" [attr.stroke]="forma.ativo ? '#008E51' : '#8A948F'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="getIcone(forma.formaPagamento)"/></svg>
          </div>
          <div>
            <p class="forma-nome">{{ getLabel(forma) }}</p>
            <p class="forma-status">{{ forma.ativo ? 'Aceito na loja' : 'Não aceito' }}</p>
          </div>
        </div>

        <button
          type="button"
          class="switch"
          [class.checked]="forma.ativo"
          role="switch"
          [attr.aria-checked]="forma.ativo"
          (click)="alternar(forma)"
        >
          <span class="switch-knob"></span>
        </button>
      </div>
    </div>

    <div class="card-footer" *ngIf="!carregando && formas.length > 0">
      <button class="btn-save" type="button" [disabled]="salvando" (click)="salvar()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        {{ salvando ? 'Salvando...' : 'Salvar Alterações' }}
      </button>
    </div>
  </div>

</div>
