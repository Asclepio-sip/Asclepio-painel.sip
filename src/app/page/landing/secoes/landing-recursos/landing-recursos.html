<section id="recursos" class="lp-container recursos">
  <div class="cabeca">
    <p class="lp-eyebrow">Recursos</p>
    <h2 class="lp-titulo">Tudo o que o seu ponto de venda precisa</h2>
    <p class="lp-lead">Do caixa ao pedido online, cada parte conversa com a outra. Nada de planilha paralela.</p>
  </div>

  <div class="grade">
    @for (r of recursos; track r.icone) {
      <article class="card">
        <span class="icone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#006B3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @switch (r.icone) {
              @case ('pdv') { <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/> }
              @case ('estoque') { <path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/> }
              @case ('catalogo') { <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/> }
              @case ('pedidos') { <path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/> }
              @case ('equipe') { <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M18 14.8c1.8.7 3 2.5 3.5 5.2"/> }
              @case ('relatorios') { <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/> }
            }
          </svg>
        </span>
        <h3 class="card-titulo lp-sora">{{ r.titulo }}</h3>
        <p class="card-texto">{{ r.texto }}</p>
      </article>
    }
  </div>
</section>
