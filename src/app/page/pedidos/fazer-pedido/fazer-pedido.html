<main class="fazer-pedido-page">
  <header class="page-header">
    <div>
      <h1>Vendas / Caixa</h1>
      <p>Atendimento ao cliente e fechamento de pedidos</p>
    </div>
  </header>

  <section class="checkout-grid">
    <div class="products-panel">
      <app-lista-produto-estoque></app-lista-produto-estoque>
    </div>

    <aside class="cart-card">
      <div class="cart-title">
        <span class="cart-icon" aria-hidden="true"></span>
        <h2>Carrinho</h2>
      </div>

      <div class="cart-items" *ngIf="itens.length > 0; else carrinhoVazio">
        <article class="cart-item" *ngFor="let item of itens">
          <div class="item-main">
            <strong>{{ item.nomeProduto }}</strong>
            <small>{{ item.nomeLoja }}</small>
            <small *ngIf="item.nomeVariacao">{{ item.nomeVariacao }}</small>
          </div>

          <div class="quantity-control">
            <button type="button" (click)="diminuir(item)" aria-label="Diminuir quantidade">-</button>
            <span>{{ item.quantidade }}</span>
            <button type="button" (click)="aumentar(item)" aria-label="Aumentar quantidade">+</button>
          </div>

          <strong class="item-total">
            {{ item.valorFinal * item.quantidade | currency:'BRL' }}
          </strong>

          <button class="remove-btn" type="button" (click)="remover(item)" aria-label="Remover item">
            Remover
          </button>
        </article>
      </div>

      <ng-template #carrinhoVazio>
        <div class="empty-cart">Carrinho vazio</div>
      </ng-template>

      <footer class="cart-footer">
        <div class="total-row">
          <span>Total</span>
          <strong>{{ totalValor() | currency:'BRL' }}</strong>
        </div>

        <button
          class="finish-btn"
          type="button"
          (click)="prosseguir()"
          [disabled]="itens.length === 0"
        >
          Prosseguir
        </button>
      </footer>
    </aside>
  </section>
</main>
