<nav class="topo" aria-label="Topo do painel">
  <div class="topo-esquerda">
    <a class="marca" routerLink="/">
      <span class="marca-icone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      </span>
      <span class="marca-texto">
        <span class="marca-nome">Asclepio</span>
        <span class="marca-sub">Painel administrativo</span>
      </span>
    </a>

    @if (authService.isAuthenticated() && nomeLoja) {
      <span class="loja">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        {{ nomeLoja }}
      </span>
    }
  </div>

  <div class="acoes">
    @if (!authService.isAuthenticated()) {
      <a routerLink="/login" class="botao botao-primario">Entrar</a>
    }

    @if (authService.isAuthenticated()) {
      <span class="usuario">
        <span class="avatar" aria-hidden="true">{{ inicial }}</span>
        <span class="usuario-nome">Olá, {{ nomeExibicao || 'suporte' }}</span>
      </span>
      <button type="button" class="botao botao-contorno" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    }
  </div>
</nav>
